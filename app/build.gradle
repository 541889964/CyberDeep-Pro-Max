apply plugin: 'com.android.application'
android {
    namespace 'com.cyber.max'
    compileSdk 36
    defaultConfig { applicationId "com.cyber.max"; minSdk 26; targetSdk 34; ndk { abiFilters 'arm64-v8a' } }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'org.mozilla.geckoview:geckoview-beta-arm64-v8a:149.0.20260227092902'
    implementation 'io.noties.markwon:core:4.6.2' // Markdown 渲染
    implementation 'com.google.code.gson:gson:2.10.1' // 本地存储
}
